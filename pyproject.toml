[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "xtrastock"
version = "0.1.0"
description = "Evidence-based financial research, collection and agent workspace"
requires-python = ">=3.11"
license = {text = "GPL-3.0-only"}
dependencies = [
  "python-dotenv>=1,<2", "psycopg[binary]>=3.3,<4", "requests>=2.31,<3",
  "httpx>=0.28,<1", "openai>=2,<3",
]

[project.optional-dependencies]
analytics = [
  "numpy>=2,<3", "pandas>=2,<3", "pyarrow>=20,<25", "matplotlib>=3.10,<4",
  "beautifulsoup4>=4.12,<5", "lxml>=4.9,<6", "openpyxl>=3.1,<4",
  "xlrd==2.0.2", "tqdm>=4.66,<5", "fastembed>=0.8,<1",
  "PyMuPDF>=1.27,<2", "Pillow>=12,<13",
]
gateway = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "anyio>=4,<5"]
dev = ["ruff>=0.11,<1", "build>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = [".local", ".venv"]

[tool.ruff.lint]
# Legacy scientific modules are being modernized incrementally. Syntax/import
# correctness is enforced across all code; style checks apply to new core code.
select = ["E9", "F63", "F7", "F82"]
