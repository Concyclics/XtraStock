[Service]
Environment=XTRASTOCK_CONFIG=@REPO@/config/local.toml
Environment=XTRASTOCK_ENV_FILE=@REPO@/.env
ExecStart=
CPUQuota=200%
TimeoutStopSec=5min
KillMode=mixed
ExecStart=@REPO@/.venv/bin/python -u scripts/search/batch_document_embeddings.py --state-dir @APP@/logs/embedding_incremental --max-documents 1800 --max-seconds 1200 --documents-per-batch 64 --batch-size 128 --chunk-budget 1024
